      summary: Get the JSON:API resource index
      description: 'Returns the JSON:API entry point: a document whose `links` member lists every exposed resource
        type and its collection URL (284 resource objects observed on 2026-07-25). This index is the machine-readable
        contract NAIC actually publishes; this OpenAPI is derived from it.'
      tags:
      - discovery
      responses:
        '200':
          description: The JSON:API resource index.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ResourceIndex'
  /action/action:
    get:
      operationId: listAction
      summary: List action resources
      description: Returns a JSON:API collection document of `action--action` resource objects. Supports JSON:API
        sparse fieldsets, sorting, filtering, related-resource inclusion and offset pagination. Verified anonymously
        readable on 2026-07-25.
      tags:
      - action
      parameters: &id001
      - $ref: '#/components/parameters/pageLimit'
      - $ref: '#/components/parameters/pageOffset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/include'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: A JSON:API collection document.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CollectionDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /action/action/{id}:
    get:
