components:
  parameters:
    pageLimit:
      name: page[limit]
      in: query
      required: false
      description: Maximum number of resource objects to return. Drupal JSON:API caps this at 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
      example: 10
    pageOffset:
      name: page[offset]
      in: query
      required: false
      description: Zero-based index of the first resource object to return. Paired with the `next`/`prev` links
        in the response.
      schema:
        type: integer
        minimum: 0
        default: 0
    sort:
      name: sort
      in: query
      required: false
      description: Comma-separated sort fields. Prefix a field with `-` for descending order, e.g. `-created`.
      schema:
        type: string
      example: -created
    filter:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: JSON:API filter expression. Simple form `filter[field]=value`; condition form `filter[label][condition][path]=field&filter[label][condition][operator]=CONTAINS`.
        An unknown field returns HTTP 400 with a JSON:API error object.
      schema:
        type: object
        additionalProperties: true
    include:
      name: include
      in: query
      required: false
      description: Comma-separated relationship paths to side-load into the `included` member, e.g. `field_tags,uid`.
      schema:
        type: string
    fields:
      name: fields
      in: query
      required: false
      style: deepObject
      explode: true
      description: 'Sparse fieldsets, keyed by resource type: `fields[node--article]=title,created`.'
      schema:
        type: object
        additionalProperties:
          type: string
    resourceId:
      name: id
      in: path
      required: true
      description: The resource's Drupal UUID.
      schema:
        type: string
        format: uuid
      example: 46f6505d-0014-46ce-95b8-5ba89e7f96f6
    resourceVersion:
      name: resourceVersion
      in: query
      required: false
      description: Revision selector, e.g. `id:717` or `rel:working-copy`. Emitted by the API in each resource's
        `links` member.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed query — for example an unknown filter path.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          examples:
            unknownFilterField:
              summary: Observed 2026-07-25
              value:
                jsonapi:
                  version: '1.1'
                errors:
                - title: Bad Request
                  status: '400'
                  detail: Invalid nested filtering. The field `nope`, given in the path `nope`, does not exist.
    NotFound:
      description: No resource matches the given identifier, or the resource type is not exposed.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/ErrorDocument'
          examples:
            unknownUuid:
              summary: Observed 2026-07-25
              value:
                jsonapi:
                  version: '1.1'
                errors:
                - title: Not Found
                  status: '404'
                  detail: The "entity" parameter was not converted for the path "/jsonapi/node/article/{entity}"
  schemas:
    JsonApiObject:
      type: object
      description: The `jsonapi` top-level member, present on every response.
      properties:
        version:
          type: string
          const: '1.1'
        meta:
          type: object
    Links:
      type: object
      description: JSON:API links object. Collections carry `self` and, when more records exist, `next`/`prev`.
      additionalProperties:
        oneOf:
        - type: string
          format: uri
        - type: object
          properties:
            href:
              type: string
              format: uri
            meta:
              type: object
    ResourceIdentifier:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
        id:
          type: string
          description: The related resource's UUID, or the literal sentinel `virtual` that Drupal JSON:API emits
            for the synthetic root term of a taxonomy hierarchy.
        meta:
          type: object
    Relationship:
      type: object
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/ResourceIdentifier'
          - type: array
            items:
              $ref: '#/components/schemas/ResourceIdentifier'
          - type: 'null'
        links:
          $ref: '#/components/schemas/Links'
    ResourceObject:
      type: object
      required:
      - type
      - id
      description: A JSON:API resource object. `attributes` and `relationships` are bundle-specific Drupal fields;
        sparse fieldsets narrow them.
      properties:
        type:
          type: string
          description: Resource type in `entity--bundle` form, e.g. `node--article`.
        id:
          type: string
          format: uuid
        links:
          $ref: '#/components/schemas/Links'
        attributes:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Relationship'
    CollectionDocument:
      type: object
      required:
      - jsonapi
      - data
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          $ref: '#/components/schemas/Links'
        meta:
          type: object
    IndividualDocument:
      type: object
      required:
      - jsonapi
      - data
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        data:
          $ref: '#/components/schemas/ResourceObject'
        included:
          type: array
          items:
            $ref: '#/components/schemas/ResourceObject'
        links:
          $ref: '#/components/schemas/Links'
    ResourceIndex:
      type: object
      required:
      - jsonapi
      - links
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        data:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/Links'
          description: One entry per exposed resource type, keyed `entity--bundle`.
    Error:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
        detail:
          type: string
        code:
          type: string
        links:
          type: object
          properties:
            via:
              type: object
              properties:
                href:
                  type: string
                  format: uri
            info:
              type: object
              properties:
                href:
                  type: string
                  format: uri
              description: Points at the HTTP status-code definition, e.g. the RFC section for 400.
    ErrorDocument:
      type: object
      required:
      - errors
      description: JSON:API error document. The NAIC surface returns JSON:API error objects, not RFC 9457 problem
        details.
      properties:
        jsonapi:
          $ref: '#/components/schemas/JsonApiObject'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
