- aid: naic:content-jsonapi
  name: NAIC Content JSON:API
  description: 'A live, anonymously readable JSON:API v1.1 surface over the NAIC''s public
    regulatory content estate, served by Drupal 11 at content.naic.org/jsonapi. The NAIC
    neither documents nor advertises it - there is no developer portal, no reference and no
    published specification - but the entry point returns a machine-readable resource index
    enumerating 284 resource types, and anonymous GET was verified against every content
    family on 2026-07-25. What it exposes is the NAIC''s own material: the model law corpus
    with its canonical MDL model numbers, the state insurance department regulator directory
    with terms of office and elected/appointed provenance, committees and task forces,
    insurance topics, publications, CIPR research, newsroom articles and the published PDF
    documents behind them. It supports the full JSON:API query grammar - sparse fieldsets,
    filtering, sorting, relationship inclusion and offset pagination capped at 50 - and
    returns JSON:API error objects rather than RFC 9457 problem details. Writes are closed:
    POST returns HTTP 401 "No authentication credentials provided." and no credentialing path
    is published. It carries the content estate only, NOT SERFF filings, the Financial Data
    Repository, SBS licensing or OPTins. Treat it as an unsupported but durable public read
    surface: no changelog, no deprecation policy, no status page, and an unversioned Drupal
    content model that can drift without notice. The OpenAPI in this repo is DERIVED by API
    Evangelist from the live resource index, not published by the NAIC.'
  humanURL: https://content.naic.org/
  baseURL: https://content.naic.org/jsonapi
