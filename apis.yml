apis:
- aid: naic:serff-web-services
  name: SERFF Web Services
  description: >-
    The NAIC-operated SERFF (System for Electronic Rates & Forms Filing) platform exposes machine integration
    services to filers, state regulators and filing vendors. The SERFF Technical Support Checklist published
    at serff.com names three services by name - Legacy SPI (two-way PUSH/PULL), Legacy SIS (one-way PULL),
    and a Modernized Data API (one-way PULL) - each available in PROD and BETA environments. There is
    NO public reference documentation, no OpenAPI or WSDL, and no self-serve signup: access is provisioned
    by request to wsrequest@naic.org and the service hosts are credential-gated (services.serff.com returned
    HTTP 403 anonymously; services-beta.serff.com returned HTTP 200 but serves only an NAIC/NIPR landing
    page). Recorded here as a real but partner-gated surface, not a public API.
  humanURL: https://www.serff.com/
  baseURL: https://services.serff.com/
  tags:
  - Insurance
  - Rate and Form Filing
  - Regulatory Reporting
  - Partner Gated
