aid: naic
url: https://raw.githubusercontent.com/api-evangelist/naic/refs/heads/main/apis.yml
name: NAIC
kind: company
description: 'The National Association of Insurance Commissioners (NAIC) is the U.S. standard-setting
  and regulatory support organization created and governed by the chief insurance regulators
  of the 50 states, the District of Columbia and five territories. It is not a carrier and
  not a federal regulator - under the McCarran-Ferguson settlement the United States has no
  national insurance supervisor, so the NAIC is the coordinating body through which state-based
  regulation is made uniform. It writes the model laws, accounting practices and Annual Statement
  Blanks that every admitted insurer files against, operates the Financial Data Repository
  behind those filings, and runs the market infrastructure the industry actually transacts
  on: SERFF for electronic rate and form filing, State Based Systems (SBS) for producer and
  company licensing in roughly thirty jurisdictions, iSite+ and myNAIC for regulator analytics,
  OPTins for premium tax, and consumer-facing lookups such as the Consumer Information Source
  and the Life Insurance Policy Locator. Its lines of business span property and casualty,
  life and annuity, health, title and fraternal across the United States. Its API posture
  is partner-gated and closed: there is no developer portal at developer/developers/docs.naic.org
  (all NXDOMAIN), no documented self-serve API, and no downloadable OpenAPI anywhere on naic.org
  or serff.com. SERFF does operate real integration services - Legacy SPI (two-way PUSH/PULL),
  Legacy SIS (one-way PULL) and a Modernized Data API (one-way PULL), in PROD and BETA - but
  they are named only on a support checklist, provisioned by emailing wsrequest@naic.org,
  and fronted by Okta login walls. Bulk regulatory data is licensed by contract through idp@naic.org
  rather than served over an API. There is, however, one real and entirely undocumented public
  machine surface: content.naic.org runs Drupal 11 and serves a live, anonymously readable
  JSON:API v1.1 at /jsonapi, whose resource index enumerates 284 resource types and exposes the
  model law corpus with its MDL numbers, the state insurance department regulator directory,
  committees, insurance topics, publications, CIPR research and the newsroom. The NAIC also
  publishes a first-party llms.txt declaring AI usage preferences, attribution requirements and
  crawl limits - so its stated contract with automated consumers is more explicit than its
  contract with API developers.'
