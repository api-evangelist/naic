out_of_scope:
  note: None of the NAIC's regulatory transaction systems are reachable from this API and no tool should
    imply otherwise.
  systems:
  - SERFF rate and form filings (partner-gated, wsrequest@naic.org)
  - Financial Data Repository statutory statements (licensed via idp@naic.org)
  - State Based Systems (SBS) producer and company licensing
  - OPTins premium tax
  - iSite+ and myNAIC regulator analytics
  - Consumer Information Source and the Life Insurance Policy Locator
