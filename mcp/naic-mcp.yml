description: 'No official or third-party hosted NAIC MCP server exists. Searched the NAIC estate (no developer
  portal, no GitHub organization — github.com/naic is an unrelated personal account with one repo), the
  MCP registries and npm; nothing was found. This is a CANDIDATE tool set derived from the NAIC''s real,
  anonymously readable JSON:API, curated down from the 569 derived operations to the surface that is actually
  worth handing an agent: the model-law corpus, the regulator directory, committees, insurance topics,
  publications and the newsroom. The 100 paragraph bundles, 11 block-content bundles and ~70 Drupal configuration
  entity types are deliberately excluded — they are page-composition plumbing, not regulatory data.'
server:
  name: naic
  transport: http
  url: null
  auth: none
  note: 'Candidate only — nothing is deployed. A server built from this would need no credentials: every
    backing operation is an anonymous GET. It would, however, need to honor the consumption terms the
    NAIC publishes in its own llms.txt: crawl_delay 10 seconds, max_requests_per_day 100, allow_model_training
    false, require_attribution true with preferred attribution name "NAIC" and URL https://content.naic.org.'
