actions:
  apisYmlUpdated: true
  openapiSaved: 0
  reason: |
    Recorded as an honest documentation-and-standards-first market-body profile.
    One apis[] entry is retained for SERFF Web Services because the service names,
    directions and environments are genuinely published by the NAIC; it carries no
    baseURL and no OpenAPI pointer because neither is documented. No openapi/
    directory was created because no real specification exists to save. This is
    the expected and correct outcome for a U.S. insurance market body: there is no
    federal regulator, no open-insurance mandate, and therefore no forcing
    function that would make the NAIC publish an API.
