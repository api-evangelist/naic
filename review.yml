aid: naic
name: NAIC
homeMarket: United States
tier: market-infrastructure
review:
  question: Does the NAIC publish a public, self-serve developer portal or documented
    API over its registers, filing systems, or statistical data?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
findings:
  summary: |
    The National Association of Insurance Commissioners is the U.S. market body
    for state-based insurance regulation — a standard-setter and shared-services
    operator, not a carrier and not a federal supervisor. It publishes NO public
    developer portal and NO documented self-serve API. Every candidate developer
    hostname was probed on 2026-07-25 and none exists: developer.naic.org,
    developers.naic.org and docs.naic.org are all NXDOMAIN. api.naic.org DOES
    resolve and answers over HTTP/2, but every probed path (/, /openapi.json,
    /swagger.json, /api-docs, /v1, /docs, /health, /swagger-ui.html, /actuator)
    returns a bare HTTP 404 with `content-type: text/plain` and the nine-byte body
    "Not Found" — an internal gateway with no public surface, not a portal.
    content.naic.org/developers, /api, /apis, /developer, /developer-resources,
    /web-services and /data all return 404.

    The real integration surface is SERFF, the NAIC-operated System for Electronic
    Rates & Forms Filing. serff.com carries a "Web Services" support block whose
    published Technical Support Checklist PDF names three actual services —
    "Legacy SPI (two-way PUSH/PULL)", "Legacy SIS (one-way PULL)" and "Modernized
    Data API (one-way PULL)" — each with PROD and BETA environments. That is the
    only place the NAIC names an API-shaped product in public. There is no
    reference documentation, no endpoint list, no OpenAPI and no WSDL behind it:
    the checklist exists so an already-provisioned integrator can report a
    failure, and access is requested by email to wsrequest@naic.org. The PROD
    host services.serff.com resolves and returns HTTP 403 anonymously;
    services-beta.serff.com returns HTTP 200 but serves only an NAIC/NIPR landing
    page, and /openapi.json, /swagger.json, /api-docs, /v1/openapi.json, /spec,
    /services and /api all 404 there. This is a partner-gated B2B filing pipe, not
    a developer platform.

    Everything else in the NAIC estate is an Okta-fronted web application. myNAIC,
    iSite+ (isiteplus.naic.org), SBS (sbs.naic.org, HTTP 403 at the root prelogin
    path), OPTins and SERFF Login all sit behind login.  eapps.naic.org returns
    HTTP 200 for /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server, but both responses are
    `text/html;charset=utf-8` pages rendering the Okta Sign-In Widget 7.35.3 — a
    catch-all login route, NOT an OIDC discovery document. No anonymous OAuth
    metadata is served anywhere on the estate.

    Public data is distributed as documents and licensed files rather than as an
    API. InsData (insdata.naic.org) sells individual company financial statements
    as PDFs. The Financial Data Repository — the warehouse behind annual and
    quarterly statutory statements covering 98%+ of U.S. written premium — is a
    regulator-facing system, with bulk CSV extracts obtained by completing a data
    request form and contacting idp@naic.org. The Consumer Information Source
    (content.naic.org/cis_consumer_information.htm, HTTP 200) and the SBS external
    Licensee/Company Lookup (sbs.naic.org/solar-external-lookup/, HTTP 200,
    an Angular SPA) are consumer web lookups with no documented API contract; the
    published bundle exposed no documented endpoints and none are recorded here.

    Note the adjacency worth not confusing: NIPR (nipr.com), the National
    Insurance Producer Registry, is a separate legal entity from the NAIC even
    though the two share systems and branding on services-beta.serff.com. Any
    producer-licensing API activity belongs on the NIPR record, not this one.
